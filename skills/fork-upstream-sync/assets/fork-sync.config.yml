# .fork-sync.yml — this fork's divergence manifest.
#
# Copy to the repo root and fill in. Everything the upstream-sync procedure needs
# to know that is SPECIFIC TO THIS FORK lives here, which is what keeps the skill
# itself generic across every fork you carry.
#
# Treat it as the fork's memory: every sync that teaches you something adds an
# entry. A manifest that never grows is a manifest nobody is reading.

upstream:
  remote: upstream
  branch: main
  # Your fork's integration branch — where synced upstream work lands.
  fork_branch: main
  # Branch name for the sync PR. {date} is substituted.
  sync_branch: "sync/upstream-{date}"

# ─────────────────────────────────────────────────────────────────────────────
# CONFLICT POLICY — how each class of conflict resolves, by path glob.
#
# Order matters: first matching rule wins. Put the narrow, high-stakes globs
# first and the broad structural ones last.
#
# Glob syntax is shell `case` pattern matching: `*` `?` `[...]` and — for
# alternation — `@(a|b)`, NOT `{a,b}`. A `{a,b}` pattern matches that literal
# string and every path it was meant to cover reports as "unclassified", which
# is easy to miss because it fails quietly. So:
#     WRONG:  "src/{sandbox,hooks}.py"
#     RIGHT:  "src/@(sandbox|hooks).py"
# `*` spans `/`, so "src/**" and "src/*" both match at any depth.
#
# policy values:
#   fork_wins        — this fork's behavior is the point; keep it, adopt upstream
#                      only where it does not touch the divergence
#   upstream_wins    — take upstream's structure, then re-apply fork fixes on top
#   union            — both sides ADD independent entries; take both (see note)
#   upstream_then_regen — take upstream, then run the regen command; never
#                      hand-merge (generated files, baselines, lockfiles)
#   manual           — always stop for a human/agent decision, no default
#
# `union` is the most commonly mis-resolved shape in a fork merge. When both
# sides append to the same list/set/import block, the two additions are two
# requirements, not two candidates. Declaring it here stops the next sync from
# treating it as a choice.
# ─────────────────────────────────────────────────────────────────────────────
conflict_policy:
  # EXAMPLE — replace with your own. Security/authorization surfaces first:
  # - glob: "src/**/security.py"
  #   policy: fork_wins
  #   keystone: true          # touching this always needs a human read
  #   note: |
  #     Fork carries a hardened path matcher upstream lacks. Both sides commonly
  #     ADD entries to the sensitive-path list — take the union of entries, but
  #     keep the fork's matcher implementation.

  # - glob: "src/**/{sandbox,auth,permissions}*.py"
  #   policy: fork_wins
  #   keystone: true

  # - glob: "src/**/dashboard/**"
  #   policy: upstream_wins
  #   note: "Adopt upstream structure, then re-apply fork fixes listed below."

  # - glob: "*-baseline.json"
  #   policy: upstream_then_regen

  # - glob: "**/package-lock.json"
  #   policy: upstream_then_regen

  # - glob: "web/**"
  #   policy: upstream_wins
  #   note: "Keep fork-only i18n/config additions (union within that policy)."

# ─────────────────────────────────────────────────────────────────────────────
# DIVERGENCES — every deliberate difference from upstream, and the test that
# defends it.
#
# `pinned_by` is the load-bearing field. A divergence with `pinned_by: null` is
# one you WILL lose on some future sync without noticing: prose cannot fail a
# build. If you cannot name a test, write one — that is the entry's real work.
#
# Each entry answers: what is different, why, and what goes red if it is undone.
# ─────────────────────────────────────────────────────────────────────────────
divergences:
  # EXAMPLE — replace with your own:
  # - id: auth-grant-sources
  #   what: "Only explicit per-session trust or global override auto-approves."
  #   why: |
  #     Upstream treats a config default as an unconditional grant, which
  #     silently auto-approves everything on a fresh install. Removing that was
  #     a security fix, not a preference — an upstream merge that restores it
  #     regresses the fork.
  #   pinned_by: "test/test_approval_parity.py::test_grant_sources"
  #   decided: 2026-08-28

  # - id: extra-backend-selectable
  #   what: "Two adapters upstream withholds are selectable here."
  #   why: "Verified end to end in this fork; upstream withholds pending review."
  #   pinned_by: "test/test_harness_parity.py::test_selectable_set"
  #   decided: 2026-08-31

# ─────────────────────────────────────────────────────────────────────────────
# TOOLCHAIN — the interpreter/runner the gates and regens must use.
#
# Spell it out. A bare `python3` or `node` can resolve to a system version whose
# output differs, and a baseline regenerated by the wrong one is silently wrong:
# it passes locally and fails in CI, or worse, passes both and encodes garbage.
# ─────────────────────────────────────────────────────────────────────────────
toolchain:
  python: ".venv/bin/python3"     # e.g. .venv/bin/python3 — NOT bare python3
  node: "npm"
  # Extra flags the project's own docs require (platform parity, etc.)
  typecheck_extra_args: ""        # e.g. "--platform linux" for mypy on macOS

# ─────────────────────────────────────────────────────────────────────────────
# GATES — fast, deterministic checks. Run before opening the PR and again after
# resolving conflicts. Keep them ordered cheapest-first.
# ─────────────────────────────────────────────────────────────────────────────
gates:
  # - name: "no conflict markers"
  #   run: "! git grep -n '^<<<<<<<\\|^>>>>>>>' -- ':!*.md'"
  # - name: "format"
  #   run: "{python} scripts/check_formatting.py"
  # - name: "lint"
  #   run: "{python} -m flake8 src test"
  # - name: "typecheck"
  #   run: "{python} -m mypy {typecheck_extra_args} src"
  # - name: "fork invariants"
  #   run: "BASE_REF=origin/{fork_branch} {python} scripts/check_fork_invariants.py"

# Generated files that must be REGENERATED after the merge, never hand-merged.
baselines:
  # - path: "config-baseline.json"
  #   regen: "{python} scripts/generate_config_baseline.py"
  # - path: "error-code-baseline.json"
  #   regen: "{python} test/test_error_code_contract.py --update"

# Test commands. `focused` runs after each resolution pass; `full` runs once
# before the PR is considered ready.
tests:
  focused: ""   # e.g. "{python} -m pytest test/test_security.py test/test_parity.py -q"
  full: ""      # e.g. "{python} -m pytest -q"
  frontend: ""  # e.g. "cd web && npm run build && npm test"

# ─────────────────────────────────────────────────────────────────────────────
# KNOWN-RED — checks that fail for reasons unrelated to any change, so a real
# failure is never mistaken for one of them (and vice versa).
#
# Each entry needs a REASON and, ideally, the fix. An entry with no reason
# becomes a permanent excuse; that is how a real regression hides in plain sight.
# Re-verify these occasionally: an entry whose cause was fixed upstream is now
# masking a genuine failure.
# ─────────────────────────────────────────────────────────────────────────────
known_red:
  # - check: "Dependency License Gate"
  #   reason: "Needs the repo's Dependency graph setting enabled."
  #   fix: "Repo Settings → Code security → enable Dependency graph."
  # - check: "AI Review (*)"
  #   reason: "Fork has no model-provider credentials; the gate fails closed."
  #   fix: "Configure provider secrets, or exempt sync PRs from these gates."
  # - check: "*@pty_integration"
  #   reason: "Known-flaky pty tests; fail on the merge base too."
  #   fix: null

# Test-failure classes proven environmental on this host/CI. Same discipline as
# known_red: prove it with a merge-base run before adding, and delete the entry
# once the cause is gone.
environmental_failures:
  # - pattern: "test_*_e2e.py"
  #   reason: "Needs network the runner denies; fails identically on merge base."
